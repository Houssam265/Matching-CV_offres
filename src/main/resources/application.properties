# ===========================================================================
# application.properties — Configuration principale de l'application
# Plateforme Matching CV-Offres | GI3, ENSA Tétouan
# ===========================================================================
#
# PRÉREQUIS BASE DE DONNÉES :
#   Assurez-vous que MySQL est démarré sur localhost:3306.
#   Le paramètre createDatabaseIfNotExist=true crée automatiquement la base
#   "matching_cv_offres" si elle n'existe pas encore.
#   Vous pouvez aussi la créer manuellement :
#       CREATE DATABASE matching_cv_offres CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#
# ===========================================================================

# --- Serveur ---
server.port=8080

# --- Source de données MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/matching_cv_offres?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "update" : Hibernate adapte le schéma sans supprimer les données existantes.
# À changer en "create-drop" pour les tests ou "validate" en production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect : NE PAS spécifier — Hibernate 6 le détecte automatiquement depuis MySQL 8+

# --- Logs (optionnel — réduit le bruit au démarrage) ---
logging.level.org.springframework=INFO
logging.level.com.gi3.matchingcv=DEBUG
