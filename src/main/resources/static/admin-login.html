<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="/js/api-client.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Connexion à l'espace Administration — Matching CV-Offres." />
    <title>Connexion Administration — MatchingCV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
    <link rel="icon" href="/favicon.svg" />
    <script src="/js/session.js"></script>
    <script>
        (function() {
            var u = MatchingCVSession.read();
            if (u && u.role === 'ADMIN') {
                window.location.replace('/admin-dashboard.html');
            }
        })();
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f8faf9;
            color: #1c4330;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Navbar ── */
        .al-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 2.5rem;
            background: #ffffff;
            border-bottom: 1px solid #e4ede9;
        }
        .al-brand {
            display: flex;
            align-items: center;
            gap: .5rem;
            text-decoration: none;
            color: #184b32;
            font-weight: 800;
            font-size: 1.05rem;
        }
        .al-brand svg { flex-shrink: 0; }
        .al-brand-badge {
            font-size: .62rem;
            background: rgba(36,119,78,.12);
            color: #184b32;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: .06em;
        }
        .al-nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .al-nav-links a {
            font-size: .84rem;
            color: #527765;
            text-decoration: none;
            font-weight: 500;
            transition: color .15s;
        }
        .al-nav-links a:hover { color: #184b32; }

        /* ── Main layout (bi-column) ── */
        .al-main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: stretch;
            min-height: calc(100vh - 64px);
        }

        /* ── Left: form panel ── */
        .al-form-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 3.5rem;
            background: #ffffff;
        }
        .al-card {
            width: 100%;
            max-width: 400px;
        }

        .al-context {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
        }
        .al-context-label {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-size: .82rem;
            font-weight: 700;
            color: #184b32;
        }
        .al-context-link {
            font-size: .8rem;
            color: #24774e;
            text-decoration: none;
            font-weight: 500;
            transition: color .15s;
        }
        .al-context-link:hover { color: #184b32; text-decoration: underline; }

        .al-title {
            font-size: 1.55rem;
            font-weight: 800;
            color: #184b32;
            line-height: 1.25;
            letter-spacing: -.03em;
            margin-bottom: .4rem;
        }
        .al-subtitle {
            font-size: .84rem;
            color: #527765;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }

        .al-alert {
            padding: .8rem 1rem;
            border-radius: 9px;
            font-size: .84rem;
            line-height: 1.45;
            margin-bottom: 1.25rem;
            display: none;
        }
        .al-alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .al-alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .al-field { margin-bottom: 1.15rem; }
        .al-label {
            display: block;
            font-size: .8rem;
            font-weight: 600;
            color: #1c4330;
            margin-bottom: .4rem;
        }
        .al-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .al-input-icon {
            position: absolute;
            left: 13px;
            color: #7ab095;
            pointer-events: none;
            display: flex;
        }
        .al-input {
            width: 100%;
            height: 46px;
            padding: 0 1rem 0 2.6rem;
            border: 1px solid #c9ded3;
            border-radius: 10px;
            font-size: .91rem;
            background: #ffffff;
            color: #1c4330;
            font-family: inherit;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .al-input:focus {
            border-color: #24774e;
            box-shadow: 0 0 0 3px rgba(36,119,78,.14);
        }
        .al-input-pwd { padding-right: 2.75rem; }

        .al-eye-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: #7ab095;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            border-radius: 6px;
            transition: color .15s;
        }
        .al-eye-btn:hover { color: #184b32; }

        .al-submit {
            width: 100%;
            height: 48px;
            margin-top: 1.5rem;
            background: #184b32;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: .95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            box-shadow: 0 2px 10px rgba(24,75,50,.18);
            transition: background .15s, transform .1s, box-shadow .15s;
        }
        .al-submit:hover:not(:disabled) {
            background: #123725;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(24,75,50,.24);
        }
        .al-submit:active:not(:disabled) { transform: none; }
        .al-submit:disabled { opacity: .72; cursor: not-allowed; }

        .al-spinner {
            width: 17px; height: 17px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: al-spin .7s linear infinite;
        }
        @keyframes al-spin { to { transform: rotate(360deg); } }

        /* ── Right: image panel ── */
        .al-visual-panel {
            position: relative;
            overflow: hidden;
            background: #dce7da;
        }
        .al-visual-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 55% center;
            display: block;
        }
        .al-visual-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, rgba(24,75,50,.18) 0%, rgba(24,75,50,.45) 100%);
        }
        .al-visual-caption {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            left: 2rem;
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 12px;
            padding: .9rem 1.1rem;
            display: flex;
            align-items: center;
            gap: .65rem;
            font-size: .78rem;
            color: #1c4330;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(24,75,50,.12);
        }
        .al-dot {
            width: 8px; height: 8px;
            background: #2e9c65;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── Footer ── */
        .al-footer {
            text-align: center;
            padding: .9rem;
            font-size: .75rem;
            color: #8aab99;
            background: #f8faf9;
            border-top: 1px solid #e4ede9;
        }

        /* ── Responsive ── */
        @media (max-width: 860px) {
            .al-main { grid-template-columns: 1fr; }
            .al-visual-panel { display: none; }
            .al-form-panel { padding: 2.5rem 1.5rem; }
        }
    </style>
<link rel="stylesheet" href="/css/admin-theme.css"><script src="/js/admin-ui.js"></script></head>
<body><script>document.body.classList.add("admin-portal");try{document.body.classList.toggle("sidebar-pinned",localStorage.getItem("matchingcv_sidebar_pinned")!=="false");}catch(e){}</script>
    <a class="skip-link" href="#al-form" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">Aller au formulaire</a>

    <!-- NAVBAR -->
    <nav class="al-nav">
        <a class="al-brand" href="/index.html">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#24774e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m5 12 4 4L19 6"/>
            </svg>
            MatchingCV
            <span class="al-brand-badge">ADMIN</span>
        </a>
        <nav class="al-nav-links" aria-label="Navigation">
            <a href="/index.html">Accueil du site</a>
            <a href="/login.html">Espaces utilisateurs</a>
        </nav>
    </nav>

    <!-- BI-COLUMN LAYOUT -->
    <main class="al-main" id="al-form">
        <!-- LEFT: Form -->
        <div class="al-form-panel">
            <div class="al-card">
                <div class="al-context">
                    <span class="al-context-label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        Espace Administration
                    </span>
                    <a href="/index.html" class="al-context-link">Changer d'espace</a>
                </div>

                <h1 class="al-title">Console<br>d'Administration</h1>
                <p class="al-subtitle">Accès sécurisé réservé aux administrateurs habilités.</p>

                <div id="al-alert" class="al-alert" role="alert"></div>

                <form id="al-login-form" novalidate>
                    <div class="al-field">
                        <label for="al-email" class="al-label">Adresse email administrateur</label>
                        <div class="al-input-wrap">
                            <span class="al-input-icon">
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                            </span>
                            <input
                                type="email"
                                id="al-email"
                                name="email"
                                class="al-input"
                                value="admin@matchingcv.fr"
                                placeholder="admin@matchingcv.fr"
                                required
                                autocomplete="email"
                            />
                        </div>
                    </div>

                    <div class="al-field">
                        <label for="al-pwd" class="al-label">Mot de passe</label>
                        <div class="al-input-wrap">
                            <span class="al-input-icon">
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </span>
                            <input
                                type="password"
                                id="al-pwd"
                                name="motDePasse"
                                class="al-input al-input-pwd"
                                value="admin123"
                                placeholder="••••••••"
                                required
                                autocomplete="current-password"
                            />
                            <button type="button" class="al-eye-btn" id="al-toggle-pwd" aria-label="Afficher ou masquer le mot de passe">
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="al-submit" id="al-btn-submit">
                        <span id="al-btn-label">Se connecter à la console</span>
                        <span class="al-spinner" id="al-spinner" style="display:none;" aria-hidden="true"></span>
                    </button>
                </form>
            </div>
        </div>

        <!-- RIGHT: Image -->
        <div class="al-visual-panel" aria-hidden="true">
            <img src="/images/rencontre-professionnelle.png" alt="Professionnels collaborant dans un environnement lumineux." fetchpriority="high">
            <div class="al-visual-overlay"></div>
            <div class="al-visual-caption">
                <span class="al-dot"></span>
                Pilotage, sécurité et modération de la plateforme.
            </div>
        </div>
    </main>

    <footer class="al-footer">
        MatchingCV &middot; Espace d'administration sécurisée
    </footer>

    <script>
    (function() {
        'use strict';

        const form      = document.getElementById('al-login-form');
        const alertBox  = document.getElementById('al-alert');
        const submitBtn = document.getElementById('al-btn-submit');
        const btnLabel  = document.getElementById('al-btn-label');
        const spinner   = document.getElementById('al-spinner');
        const togglePwd = document.getElementById('al-toggle-pwd');
        const pwdInput  = document.getElementById('al-pwd');
        const emailInput = document.getElementById('al-email');

        // Toggle password visibility
        if (togglePwd && pwdInput) {
            togglePwd.addEventListener('click', function() {
                const show = pwdInput.type === 'password';
                pwdInput.type = show ? 'text' : 'password';
                togglePwd.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
                togglePwd.innerHTML = show
                    ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                    : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
            });
        }

        function showAlert(msg, isError) {
            alertBox.textContent = msg;
            alertBox.className = 'al-alert ' + (isError ? 'al-alert-error' : 'al-alert-success');
            alertBox.style.display = 'block';
        }

        function setLoading(on) {
            submitBtn.disabled = on;
            btnLabel.textContent = on ? 'Connexion en cours…' : 'Se connecter à la console';
            spinner.style.display = on ? 'inline-block' : 'none';
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            alertBox.style.display = 'none';

            const email      = emailInput.value.trim();
            const motDePasse = pwdInput.value;

            if (!email || !motDePasse) {
                showAlert('Veuillez renseigner votre adresse email et votre mot de passe.', true);
                return;
            }

            setLoading(true);
            try {
                const resp = await fetch('/api/auth/connexion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, motDePasse, role: 'ADMIN' })
                });

                let data;
                try { data = await resp.json(); } catch(_) { data = {}; }

                if (!resp.ok) {
                    showAlert(data.message || 'Identifiants incorrects ou compte inexistant.', true);
                    setLoading(false);
                    return;
                }

                if (!data || data.role !== 'ADMIN') {
                    showAlert('Accès refusé. Ce compte n\'a pas les droits administrateur.', true);
                    setLoading(false);
                    return;
                }

                // Stockage session identique à auth.js (champs requis par session.js)
                localStorage.setItem('matchingcv_user', JSON.stringify({
                    id:     data.id,
                    prenom: data.prenom,
                    nom:    data.nom,
                    email:  data.email,
                    role:   data.role
                }));

                showAlert('Connexion réussie. Redirection…', false);
                setTimeout(() => { window.location.replace('/admin-dashboard.html'); }, 500);

            } catch (err) {
                showAlert('Erreur réseau. Vérifiez que le serveur est démarré (port 8080).', true);
                setLoading(false);
            }
        });
    })();
    </script>
</body>
</html>
