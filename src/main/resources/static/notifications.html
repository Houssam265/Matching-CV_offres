<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Centre de Notifications — Matching CV-Offres</title>
    <meta name="description" content="Consultez l'historique complet de vos notifications en temps réel."/>
    <script src="/js/session.js"></script>
    <script>MatchingCVSession.protect('ETUDIANT');</script>
    <!-- SockJS et STOMP pour la réception en direct -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="stylesheet" href="/css/notifications.css"/>
    <style>
        body { background: var(--bg); color: var(--text-dark); font-family: var(--font-family); }

        /* ── Hero ── */
        .nh { background: var(--banner-gradient); padding: 3rem 1.5rem 2.8rem; color: #fff; position: relative; overflow: hidden; }
        .nh::before { content: ''; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 48px 48px; }
        .nhi { position: relative; z-index: 1; max-width: var(--content-width); margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; }
        .nh-title { font-size: clamp(1.4rem, 3vw, 2.1rem); font-weight: 800; }
        .nh-title span { color: #5FD88A; }
        .nh-sub { font-size: 0.92rem; color: rgba(255,255,255,.75); margin-top: 0.35rem; }

        /* ── Layout Principal ── */
        .main-notif { max-width: 900px; margin: 2rem auto 5rem; padding: 0 1.5rem; }

        /* ── Barre de Filtres ── */
        .filter-panel {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem 1.4rem;
            margin-bottom: 1.8rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .filter-tabs { display: flex; align-items: center; gap: 0.6rem; }
        .btn-tab {
            padding: 0.45rem 1.15rem;
            border-radius: 100px;
            border: 1.5px solid var(--border);
            background: #fff;
            color: var(--text-mid);
            font-size: 0.82rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-tab:hover { border-color: var(--teal); color: var(--teal); }
        .btn-tab.active { background: var(--teal); border-color: var(--teal); color: #fff; }

        .btn-mark-all {
            background: rgba(46, 139, 139, 0.08);
            border: 1px solid rgba(46, 139, 139, 0.25);
            color: var(--teal);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 0.45rem 1.15rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-mark-all:hover { background: var(--teal); color: #fff; }

        /* ── Cartes de Notifications ── */
        .notif-history-list { display: flex; flex-direction: column; gap: 0.9rem; list-style: none; padding: 0; margin: 0; }

        .notif-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: flex-start;
            gap: 1.15rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .notif-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: rgba(46, 139, 139, 0.35);
        }

        .notif-card.unread {
            background: #F0FDF4;
            border-left: 4.5px solid var(--teal);
        }

        .notif-card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .notif-card-icon svg { width: 22px; height: 22px; }

        .notif-card-body { flex: 1; min-width: 0; }

        .notif-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.35rem;
            flex-wrap: wrap;
        }

        .notif-card-title {
            font-size: 0.98rem;
            font-weight: 800;
            color: var(--navy-deep);
        }

        .notif-card-date {
            font-size: 0.78rem;
            color: var(--text-light);
            font-weight: 600;
        }

        .notif-card-msg {
            font-size: 0.86rem;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 0.5rem;
        }

        .notif-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding-top: 0.4rem;
        }

        .notif-card-link-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--teal);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .notif-status-badge {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.15rem 0.55rem;
            border-radius: 100px;
        }

        .notif-status-badge.new {
            background: #DCFCE7;
            color: #15803D;
        }

        .notif-status-badge.read {
            background: #F1F5F9;
            color: #94A3B8;
        }

        /* ── Pagination ── */
        .pagination-bar {
            margin-top: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .btn-page {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 0.5rem 1.1rem;
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--navy-deep);
            cursor: pointer;
            transition: all 0.18s;
            font-family: inherit;
        }

        .btn-page:hover:not(:disabled) {
            border-color: var(--teal);
            color: var(--teal);
        }

        .btn-page:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .page-indicator {
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--text-mid);
        }

        /* ── État vide ── */
        .empty-history {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 3.5rem 1.5rem;
            text-align: center;
            color: var(--text-mid);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .empty-history-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #F1F5F9;
            color: #94A3B8;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.4rem;
        }
    </style>
</head>
<body>

<!-- NAVBAR COMMUNE -->
<nav class="navbar" id="navbar" role="navigation">
    <div class="nav-inner">
        <a href="/dashboard-etudiant.html" class="nav-logo">
            <span class="logo-mark"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" stroke="url(#lg1)" stroke-width="2"/><path d="M8 14l4 4 8-8" stroke="url(#lg1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="lg1" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#2E5A9C"/><stop offset="1" stop-color="#2E8B8B"/></linearGradient></defs></svg></span>
            <span class="logo-text">Matching<strong>CV</strong></span>
        </a>
        <ul class="nav-links" id="nav-links" role="list">
            <li><a href="/dashboard-etudiant.html" class="nav-link">Tableau de bord</a></li>
            <li><a href="/offres-recommandees.html" class="nav-link">Offres recommandées</a></li>
            <li><a href="/mes-candidatures.html" class="nav-link">Mes Candidatures</a></li>
            <li><a href="/dashboard-etudiant.html?open=profil" class="nav-link" id="nav-link-profil" title="Consulter et modifier mon profil">Mon Profil</a></li>
            <li><a href="/competences.html" class="nav-link">Compétences</a></li>
        </ul>
        <div class="nav-cta">
            <span id="nav-user-name" class="nav-user-label" style="cursor:pointer;" title="Consulter mon profil"></span>
            <button class="btn-nav-outline" id="nav-logout">Déconnexion</button>
        </div>
        <button class="nav-burger" id="nav-burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
</nav>

<!-- HERO -->
<div class="nh">
    <div class="nhi">
        <div>
            <div class="nh-title">Centre de <span>Notifications</span></div>
            <div class="nh-sub">Suivez vos correspondances d'offres, retours de recruteurs et validations de compétences.</div>
        </div>
    </div>
</div>

<!-- CONTENU PRINCIPAL -->
<main class="main-notif">
    <!-- Barre de filtrage -->
    <div class="filter-panel">
        <div class="filter-tabs">
            <button type="button" class="btn-tab active" id="tab-all">
                Toutes
            </button>
            <button type="button" class="btn-tab" id="tab-unread">
                Non lues seulement
            </button>
        </div>
        <button type="button" class="btn-mark-all" id="btn-page-readall">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            Tout marquer comme lu
        </button>
    </div>

    <!-- Liste d'historique -->
    <ul class="notif-history-list" id="notif-history-list">
        <!-- Rendu dynamique -->
    </ul>

    <!-- Pagination -->
    <div class="pagination-bar" id="pagination-bar" style="display:none;">
        <button type="button" class="btn-page" id="btn-prev-page">&larr; Précédent</button>
        <span class="page-indicator" id="page-indicator">Page 1 / 1</span>
        <button type="button" class="btn-page" id="btn-next-page">Suivant &rarr;</button>
    </div>
</main>

<script src="/js/notifications.js"></script>
<script>
'use strict';

document.addEventListener('DOMContentLoaded', async () => {
    const user = MatchingCVSession.require('ETUDIANT');
    if (!user) return;

    // Mise à jour de la navbar
    const navUser = document.getElementById('nav-user-name');
    if (navUser && user.prenom) {
        navUser.textContent = `${user.prenom} ${user.nom || ''}`.trim();
    }
    document.getElementById('nav-logout')?.addEventListener('click', () => MatchingCVSession.logout());

    // Burger mobile navbar
    const nb = document.getElementById('navbar'), bg = document.getElementById('nav-burger');
    if (bg && nb) {
        bg.addEventListener('click', () => {
            const o = nb.classList.toggle('menu-open');
            bg.classList.toggle('open', o);
            bg.setAttribute('aria-expanded', String(o));
        });
    }

    // État local de la page
    let filterUnreadOnly = false;
    let currentPage = 0;
    const pageSize = 10;
    let totalPages = 1;
    let currentItems = [];

    const listEl = document.getElementById('notif-history-list');
    const tabAll = document.getElementById('tab-all');
    const tabUnread = document.getElementById('tab-unread');
    const btnReadAll = document.getElementById('btn-page-readall');
    const paginationBar = document.getElementById('pagination-bar');
    const btnPrev = document.getElementById('btn-prev-page');
    const btnNext = document.getElementById('btn-next-page');
    const pageIndicator = document.getElementById('page-indicator');

    function esc(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatTime(iso) {
        if (!iso) return '';
        try {
            const d = new Date(iso);
            return d.toLocaleDateString('fr-FR', {
                day: 'numeric',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        } catch (_) { return iso; }
    }

    function getIcon(type) {
        switch (type) {
            case 'OFFRE_CORRESPONDANTE':
                return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
            case 'CANDIDATURE_ACCEPTEE':
                return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
            case 'CANDIDATURE_VUE':
                return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            case 'CANDIDATURE_REFUSEE':
                return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
            case 'COMPETENCE_VALIDEE':
                return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
            case 'COMPETENCE_REJETEE':
                return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
            case 'NOUVELLE_CANDIDATURE':
                return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>`;
            default:
                return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`;
        }
    }

    async function loadNotifications() {
        try {
            const url = `/api/utilisateurs/${user.id}/notifications?nonLues=${filterUnreadOnly}&page=${currentPage}&size=${pageSize}`;
            const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
            if (!res.ok) throw new Error('Erreur de chargement');
            const data = await res.json();
            currentItems = data.content || [];
            totalPages = data.totalPages || 1;
            render();
        } catch (e) {
            listEl.innerHTML = `<li class="empty-history"><p style="color:#DC2626;">Impossible de charger les notifications.</p></li>`;
        }
    }

    function render() {
        if (!currentItems || currentItems.length === 0) {
            listEl.innerHTML = `
                <li class="empty-history">
                    <div class="empty-history-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    </div>
                    <div style="font-size:1.05rem;font-weight:800;color:var(--navy-deep);">Aucune notification</div>
                    <div style="font-size:.85rem;color:var(--text-light);">
                        ${filterUnreadOnly ? 'Vous n\'avez aucune notification non lue en attente.' : 'Votre boîte de notifications est vide pour le moment.'}
                    </div>
                </li>
            `;
            paginationBar.style.display = 'none';
            return;
        }

        listEl.innerHTML = currentItems.map(n => {
            const iconSvg = getIcon(n.type);
            const iconClass = `notif-type-${n.type}`;
            const unreadClass = n.lue ? '' : 'unread';
            const statusBadge = n.lue
                ? '<span class="notif-status-badge read">Déjà lue</span>'
                : '<span class="notif-status-badge new">Non lue</span>';

            const linkAction = n.lien
                ? `<span class="notif-card-link-badge">Ouvrir le détail &rarr;</span>`
                : '';

            return `
                <li class="notif-card ${unreadClass}" data-id="${n.id}">
                    <div class="notif-card-icon ${iconClass}">
                        ${iconSvg}
                    </div>
                    <div class="notif-card-body">
                        <div class="notif-card-top">
                            <span class="notif-card-title">${esc(n.titre)}</span>
                            <span class="notif-card-date">${esc(formatTime(n.dateCreation))}</span>
                        </div>
                        <div class="notif-card-msg">${esc(n.message)}</div>
                        <div class="notif-card-footer">
                            ${statusBadge}
                            ${linkAction}
                        </div>
                    </div>
                </li>
            `;
        }).join('');

        // Attachement des clics sur les cartes
        listEl.querySelectorAll('.notif-card').forEach(card => {
            card.addEventListener('click', async () => {
                const id = Number(card.dataset.id);
                const notif = currentItems.find(n => n.id === id);
                if (notif) {
                    if (!notif.lue) {
                        await fetch(`/api/notifications/${notif.id}/lue`, { method: 'PATCH' }).catch(() => {});
                        notif.lue = true;
                        card.classList.remove('unread');
                    }
                    if (notif.lien) {
                        window.location.href = notif.lien;
                    }
                }
            });
        });

        // Gestion de la pagination
        if (totalPages > 1) {
            paginationBar.style.display = 'flex';
            pageIndicator.textContent = `Page ${currentPage + 1} / ${totalPages}`;
            btnPrev.disabled = (currentPage === 0);
            btnNext.disabled = (currentPage >= totalPages - 1);
        } else {
            paginationBar.style.display = 'none';
        }
    }

    // Gestion des onglets
    tabAll.addEventListener('click', () => {
        filterUnreadOnly = false;
        tabAll.classList.add('active');
        tabUnread.classList.remove('active');
        currentPage = 0;
        loadNotifications();
    });

    tabUnread.addEventListener('click', () => {
        filterUnreadOnly = true;
        tabUnread.classList.add('active');
        tabAll.classList.remove('active');
        currentPage = 0;
        loadNotifications();
    });

    // Tout marquer comme lu
    btnReadAll.addEventListener('click', async () => {
        try {
            await fetch(`/api/utilisateurs/${user.id}/notifications/tout-lire`, { method: 'PATCH' });
            currentItems.forEach(n => n.lue = true);
            render();
            // Notifier le NotificationBell
            if (window.NotificationBell) {
                window.NotificationBell.markAllAsRead();
            }
        } catch (_) {}
    });

    // Boutons pagination
    btnPrev.addEventListener('click', () => {
        if (currentPage > 0) {
            currentPage--;
            loadNotifications();
        }
    });

    btnNext.addEventListener('click', () => {
        if (currentPage < totalPages - 1) {
            currentPage++;
            loadNotifications();
        }
    });

    // Écoute des nouvelles notifications en direct pour actualiser la page si ouverte
    if (window.NotificationBell) {
        window.NotificationBell.onNotification((newNotif) => {
            // Recharger la première page
            if (currentPage === 0) {
                loadNotifications();
            }
        });
    }

    loadNotifications();
});
</script>
</body>
</html>
